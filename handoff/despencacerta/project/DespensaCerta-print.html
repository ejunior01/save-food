<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DespensaCerta — Redesign · Print</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="styles.css"/>

  <style>
    /* ── Print page layout ─────────────────────────────────────────── */
    html, body {
      background: #E8DFCB;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      color: var(--ink);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    #root {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    .print-page {
      background: var(--canvas);
      width: 794px;        /* A4 portrait at 96dpi */
      min-height: 1123px;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      break-after: page;
      break-inside: avoid;
      page-break-after: always;
      page-break-inside: avoid;
      position: relative;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 28px;
    }
    .head-left { flex: 1; min-width: 0; }
    .head-section {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .head-title {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 30px;
      line-height: 1.0;
      letter-spacing: -0.01em;
      margin: 0;
      color: var(--ink);
      font-weight: 400;
    }
    .head-right {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .head-brand {
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .head-brand strong {
      color: var(--ink);
      font-weight: 600;
    }
    .head-page {
      font-family: var(--font-display);
      font-size: 22px;
      font-style: italic;
      color: var(--ink);
      letter-spacing: 0;
      text-transform: none;
    }

    .phone-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 0 20px;
    }

    .page-foot {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 16px;
      border-top: 1px solid var(--hairline-soft);
    }

    /* ── Cover ────────────────────────────────────────────────────── */
    .print-page.cover {
      background: var(--canvas);
      padding: 80px 64px 60px;
    }
    .cover-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .cover-title {
      font-family: var(--font-display);
      font-size: 124px;
      line-height: 0.92;
      letter-spacing: -0.03em;
      margin: 0 0 24px;
      font-weight: 400;
    }
    .cover-title i { color: var(--primary); }
    .cover-sub {
      font-size: 17px;
      line-height: 1.4;
      max-width: 440px;
      color: var(--muted);
      margin: 0 0 60px;
    }
    .cover-stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 18px;
      margin-bottom: 60px;
    }
    .cover-stat {
      background: var(--surface);
      border-radius: 18px;
      padding: 22px;
      box-shadow: inset 0 0 0 1px var(--hairline);
    }
    .cover-stat .n {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 56px;
      line-height: 1;
      color: var(--ink);
    }
    .cover-stat .l {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
    }

    .cover-toc {
      margin-top: auto;
    }
    .toc-head {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .toc-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--hairline-soft);
    }
    .toc-num {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      width: 28px;
    }
    .toc-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-style: italic;
      color: var(--ink);
    }
    .toc-leader {
      flex: 1;
      border-bottom: 1px dotted rgba(26,43,31,0.25);
      margin-bottom: 6px;
    }
    .toc-count {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .cover-foot {
      margin-top: 50px;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 16px;
      border-top: 1px solid var(--hairline);
    }

    /* ── @media print: full-bleed, no shadows ─────────────────────── */
    @page {
      size: A4 portrait;
      margin: 0;
    }
    @media print {
      html, body { background: var(--canvas); }
      #root { gap: 0; padding: 0; }
      .print-page {
        box-shadow: none;
        margin: 0;
        width: 100%;
        height: 297mm;
        min-height: 297mm;
        padding: 12mm 14mm;
      }
      .print-page.cover { padding: 18mm 16mm; }
      .cover-title { font-size: 100px; }
      .head-title { font-size: 26px; }
      .phone-stage { padding: 6mm 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data + starter components -->
  <script src="data.js"></script>
  <script type="text/babel" src="android-frame.jsx"></script>

  <!-- App code -->
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="screens2.jsx"></script>
  <script type="text/babel" src="screens3.jsx"></script>
  <script type="text/babel" src="screens4.jsx"></script>
  <script type="text/babel" src="screens5.jsx"></script>
  <script type="text/babel" src="screens6.jsx"></script>
  <script type="text/babel" src="screens7.jsx"></script>
  <script type="text/babel" src="print-app.jsx"></script>
</body>
</html>
